[project]
name = "real_time_health_monitor"
version = "0.1.0"
description = "real_time_health_monitor using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.10.1"
]

[project.scripts]
real_time_health_monitor = "real_time_health_monitor.main:run"
run_crew = "real_time_health_monitor.main:run"
train = "real_time_health_monitor.main:train"
replay = "real_time_health_monitor.main:replay"
test = "real_time_health_monitor.main:test"
run_with_trigger = "real_time_health_monitor.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
